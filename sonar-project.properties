# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_mmo-cr-copilot-dashboard
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/mmo-cr-copilot-dashboard
sonar.links.ci=https://github.com/DEFRA/mmo-cr-copilot-dashboard/actions
sonar.links.scm=https://github.com/DEFRA/mmo-cr-copilot-dashboard
sonar.links.issue=https://github.com/DEFRA/mmo-cr-copilot-dashboard/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

sonar.cpd.exclusions=src/**/*.test.js,src/**/*.test.jsx
