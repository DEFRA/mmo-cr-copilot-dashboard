services:
  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'

  mmo-cr-copilot-dashboard:
    build:
      context: .
      target: development
    ports:
      - '3000:3000'
      # Vite HMR websocket, so client edits reach the browser without a reload.
      - '24678:24678'
    depends_on:
      redis:
        condition: service_started
    # Reaches the backend on the host's port 3001, whether it runs from the
    # backend repo's compose or `npm run dev`.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Local secrets such as Entra IDs; `environment` below still wins.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      SESSION_COOKIE_SECURE: false
      COPILOT_BACKEND_API_URL: http://host.docker.internal:3001
      # Must match INGEST_TOKEN on the backend (dashboard to backend only).
      INGEST_TOKEN: local-development-ingest-token
    # Source is mounted, so nodemon restarts the server and Vite recompiles the
    # client on every edit. Dependency changes rebuild the image under --watch.
    volumes:
      - ./src:/home/node/src
      - ./public:/home/node/public
      - ./vite.config.js:/home/node/vite.config.js
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  # Not used by this service: MongoDB belongs to the backend, and there is no
  # AWS (S3/SQS/SNS) dependency.
